<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>متجري الاحترافي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f4f4f4}
header{background:#111;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px}
.cart{background:#ffcc00;color:#000;padding:5px 10px;border-radius:5px;font-weight:bold}
.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;padding:20px}
.card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center;transition:0.3s}
.card:hover{transform:scale(1.03)}
.card img{width:100%;border-radius:10px}
.card h3{margin:10px 0}
.price{color:green;font-weight:bold}
button{background:#111;color:#fff;border:none;padding:8px 10px;border-radius:5px;cursor:pointer}
button:hover{background:#333}
footer{text-align:center;padding:15px;margin-top:20px;background:#111;color:#fff}
</style>
</head>
<body>

<header>
<h1>🛒 متجري الاحترافي</h1>
<div class="cart">السلة: <span id="cart-count">0</span></div>
</header>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/300" />
<h3>منتج 1</h3>
<p class="price">$10</p>
<button onclick="addToCart()">أضف إلى السلة</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300" />
<h3>منتج 2</h3>
<p class="price">$20</p>
<button onclick="addToCart()">أضف إلى السلة</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300" />
<h3>منتج 3</h3>
<p class="price">$30</p>
<button onclick="addToCart()">أضف إلى السلة</button>
</div>

</div>

<footer>
© 2026 متجري - جميع الحقوق محفوظة
</footer>

<script>
let count = 0;
function addToCart(){
count++;
document.getElementById('cart-count').innerText = count;
alert('تمت إضافة المنتج إلى السلة 🛒');
}
</script>

</body>
</html>
